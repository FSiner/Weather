    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            overflow-x: hidden; background-color: #121318; color: white;
        }

        #bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: background 2s ease-in-out; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .main-wrapper {
            position: relative; z-index: 3; width: 100%; min-height: 100%;
            display: flex; justify-content: center; align-items: center; padding: 40px 10px;
        }

        .dashboard {
            background: rgba(0, 0, 0, 0.5); padding: 30px; border-radius: 24px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            width: 100%; max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.5s ease;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 8px; }
        .clock-box { font-size: 2rem; font-weight: 700; letter-spacing: 1px; flex-grow: 1; }
        
        .ctrl-btn { background: rgba(255,255,255,0.12); border: none; padding: 8px 14px; color: white; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .ctrl-btn:hover { background: rgba(255,255,255,0.25); }
        .audio-on { background: rgba(76, 175, 80, 0.3); border: 1px solid rgba(76, 175, 80, 0.5); }

        .select-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .weather-select {
            width: 100%; padding: 11px; font-size: 0.9rem; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; background: rgba(255, 255, 255, 0.15); color: white; outline: none; cursor: pointer;
        }
        .weather-select option { background: #1a1c23; color: white; }

        .location { font-size: 1.6rem; font-weight: bold; }
        .weather-main { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 5px 0; }
        .weather-icon { width: 60px; height: 60px; }
        .temp { font-size: 3.8rem; font-weight: 300; }
        .description { font-size: 1.1rem; margin-bottom: 15px; color: #e5e5ea; }

        .smart-section { background: rgba(255, 255, 255, 0.07); padding: 15px; border-radius: 14px; margin-bottom: 15px; text-align: left; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.03); }
        .section-title { font-size: 0.8rem; color: #aaaaae; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        
        .coordi-text { font-weight: bold; color: #ffeb3b; line-height: 1.4; }
        .timeline-box { display: flex; justify-content: space-between; margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.1); }
        .timeline-item { text-align: center; flex: 1; font-size: 0.8rem; }
        .memo-area { width: 100%; height: 60px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; padding: 8px; font-size: 0.85rem; resize: none; outline: none; }

        .status-msg { font-size: 0.85rem; color: #ff6b6b; margin-top: 10px; display: none; text-align: center; padding: 8px; background: rgba(255,0,0,0.1); border-radius: 8px; }

        function startClock() {
            setInterval(() => {
                if(isPomoActive) return;
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('ko-KR', { hour12: false });
            }, 1000);
        }

        function togglePomodoro() {
            const btn = document.getElementById('pomo-trigger');
            const card = document.getElementById('main-card');
            const clockDisplay = document.getElementById('clock');

            if (!isPomoActive) {
                isPomoActive = true; btn.innerText = "집중 해제 ❌"; card.style.opacity = "0.15";
                let timeLeft = 25 * 60; clockDisplay.innerText = "25:00";
                pomoInterval = setInterval(() => {
                    timeLeft--;
                    let min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                    let sec = (timeLeft % 60).toString().padStart(2, '0');
                    clockDisplay.innerText = `${min}:${sec}`;
                    if(timeLeft <= 0) { clearInterval(pomoInterval); alert("집중 시간이 만료되었습니다!"); togglePomodoro(); }
                }, 1000);
            } else {
                isPomoActive = false; clearInterval(pomoInterval); btn.innerText = "집중 모드 ⏱️"; card.style.opacity = "1";
            }
        }

        function initAudioEngine() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const sampleRate = audioCtx.sampleRate;
            const bufferSeconds = 6; 
            const numSamples = sampleRate * bufferSeconds;

            if (!preRenderedBuffers['brown']) {
                const buffer = audioCtx.createBuffer(1, numSamples, sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0.0;
                for (let i = 0; i < numSamples; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.018 * white)) / 1.018;
                    lastOut = data[i];
                    data[i] *= 3.8; 
                }
                preRenderedBuffers['brown'] = buffer;
            }

            if (!preRenderedBuffers['pink']) {
                const buffer = audioCtx.createBuffer(1, numSamples, sampleRate);
                const data = buffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < numSamples; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                    data[i] *= 0.12; 
                }
                preRenderedBuffers['pink'] = buffer;
            }
        }

        function toggleAudio() {
            const btn = document.getElementById('audio-trigger');
            initAudioEngine();

            if (!isAudioPlaying) {
                isAudioPlaying = true; btn.innerText = "사운드 ON 🔊"; btn.classList.add('audio-on'); 
                playAmbientSound(currentWeatherData);
            } else {
                isAudioPlaying = false; btn.innerText = "사운드 OFF 🔇"; btn.classList.remove('audio-on'); 
                stopAmbientSound();
            }
        }

        function playAmbientSound(weather) {
            if (!isAudioPlaying || !audioCtx) return;
            stopAmbientSound();

            if(!preRenderedBuffers['brown'] || !preRenderedBuffers['pink']) {
                initAudioEngine();
            }

            const mainFilter = audioCtx.createBiquadFilter();
            const mainGain = audioCtx.createGain();
            let sourceNode = audioCtx.createBufferSource();

            const condition = weather === 'Drizzle' || weather === 'Thunderstorm' ? 'Rain' : weather;

            if (condition === 'Rain') {
                sourceNode.buffer = preRenderedBuffers['brown'];
                mainFilter.type = 'lowpass';
                mainFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
                mainGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            } else if (condition === 'Clouds' || condition === 'Mist' || condition === 'Fog') {
                sourceNode.buffer = preRenderedBuffers['brown'];
                mainFilter.type = 'lowpass';
                mainFilter.frequency.setValueAtTime(180, audioCtx.currentTime);
                mainGain.gain.setValueAtTime(0.32, audioCtx.currentTime);
            } else if (condition === 'Snow') {
                sourceNode.buffer = preRenderedBuffers['pink'];
                mainFilter.type = 'lowpass';
                mainFilter.frequency.setValueAtTime(100, audioCtx.currentTime);
                mainGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            } else {
                sourceNode.buffer = preRenderedBuffers['pink'];
                mainFilter.type = 'bandpass';
                mainFilter.frequency.setValueAtTime(400, audioCtx.currentTime);
                mainGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            }

            sourceNode.loop = true;
            sourceNode.connect(mainFilter);
            mainFilter.connect(mainGain);
            mainGain.connect(audioCtx.destination);
            sourceNode.start();

            let dropInterval = null;
            if (condition === 'Rain') {
                dropInterval = setInterval(() => {
                    if (!isAudioPlaying || !audioCtx) { clearInterval(dropInterval); return; }
                    
                    if (Math.random() > 0.38) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

                        osc.type = 'sine';
                        const randomFreq = 130 + Math.random() * 190;
                        osc.frequency.setValueAtTime(randomFreq, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.035);

                        const targetVol = 0.01 + Math.random() * 0.035;
                        gain.gain.setValueAtTime(targetVol, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.035);

                        if (panner) {
                            panner.pan.setValueAtTime(Math.random() * 1.6 - 0.8, audioCtx.currentTime);
                            osc.connect(gain).connect(panner).connect(audioCtx.destination);
                        } else {
                            osc.connect(gain).connect(audioCtx.destination);
                        }

                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.04);
                    }
                }, 50);
            }

            ambientSourceNode = {
                baseSource: sourceNode,
                interval: dropInterval
            };
        }

        function stopAmbientSound() {
            if (ambientSourceNode) {
                if (ambientSourceNode.baseSource) {
                    try { ambientSourceNode.baseSource.stop(); } catch(e) {}
                }
                if (ambientSourceNode.interval) {
                    clearInterval(ambientSourceNode.interval);
                }
                ambientSourceNode = null;
            }
        }

        function saveMemo() { localStorage.setItem('weather_dashboard_memo', document.getElementById('memo-pad').value); }

        function updateSubRegions() {
            const mainSel = document.getElementById('main-region');
            const subSel = document.getElementById('sub-region');
            subSel.innerHTML = '<option value="" disabled selected>시/군/구 선택</option>';
            if (regionDatabase[mainSel.value]) {
                regionDatabase[mainSel.value].forEach(item => {
                    const opt = document.createElement('option'); opt.value = item.code; opt.innerText = item.name;
                    subSel.appendChild(opt);
                });
                subSel.disabled = false;
            }
        }

        function changeLiveRegion() {
            const mainSel = document.getElementById('main-region');
            const subSel = document.getElementById('sub-region');
            targetCityCode = subSel.value; if (!targetCityCode) return;

            localStorage.setItem('saved_main', mainSel.value);
            localStorage.setItem('saved_sub', targetCityCode);
            initWeatherSync();
        }

        function initWeatherSync() {
            if (MY_FIXED_API_KEY === "여기에_본인의_오픈웨더_API_키를_넣으세요" || !MY_FIXED_API_KEY) {
                const statusMsg = document.getElementById('status-msg');
                statusMsg.innerText = "코드의 MY_FIXED_API_KEY 변수에 오픈웨더 API 키를 입력해 주세요.";
                statusMsg.style.display = 'block';
                return;
            }
            if (liveTimer) clearInterval(liveTimer);
            fetchSmartDashboardData(targetCityCode);
            liveTimer = setInterval(() => fetchSmartDashboardData(targetCityCode), 600000);
        }

        async function fetchSmartDashboardData(cityCode) {
            const statusMsg = document.getElementById('status-msg');
            if(!cityCode || !MY_FIXED_API_KEY) return;

            const currentUrl = `https://api.openweathermap.org/data/2.5/weather?q=${cityCode},KR&appid=${MY_FIXED_API_KEY}&units=metric&lang=kr`;
            const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${cityCode},KR&appid=${MY_FIXED_API_KEY}&units=metric&lang=kr`;

            try {
                const [cRes, fRes] = await Promise.all([fetch(currentUrl), fetch(forecastUrl)]);
                if (!cRes.ok) throw new Error('오픈웨더 API 연동 실패. 키 값이 올바른지 다시 확인해 주세요.');
                
                const currentData = await cRes.json();
                const forecastData = await fRes.json();

                statusMsg.style.display = 'none';
                updateDashboardUI(currentData, forecastData);
            } catch (error) {
                statusMsg.innerText = error.message; statusMsg.style.display = 'block';
            }
        }

        function updateDashboardUI(cData, fData) {
            currentWeatherData = cData.weather[0].main;
            const temp = Math.round(cData.main.temp);
            const iconCode = cData.weather[0].icon;
            const isNight = iconCode.includes('n');

            const subSel = document.getElementById('sub-region');
            if(subSel.selectedIndex >= 0) {
                document.getElementById('location').innerText = subSel.options[subSel.selectedIndex].text;
            }
            document.getElementById('temp').innerText = `${temp}°`;
            document.getElementById('description').innerText = cData.weather[0].description;

            const iconImg = document.getElementById('w-icon');
            iconImg.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`; iconImg.style.display = 'block';

            const bgContainer = document.getElementById('bg-overlay');
            const styleTable = isNight ? backgroundsNight : backgroundsDay;
            bgContainer.style.background = styleTable[currentWeatherData] || styleTable['Default'];

            calculateClothing(temp, currentWeatherData);
            calculateTimeline(fData);
            initParticleEffect(currentWeatherData);

            if (isAudioPlaying) playAmbientSound(currentWeatherData);
        }

        function calculateClothing(temp, weather) {
            let advice = "";
            if (temp >= 23) advice = "반팔 티셔츠, 얇은 셔츠, 반바지가 어울리는 날씨예요. 👕";
            else if (temp >= 17 && temp < 23) advice = "맨투맨, 얇은 니트, 가디건에 긴바지를 추천해요. 🧥";
            else if (temp >= 9 && temp < 17) advice = "자켓, 트렌치코트, 가벼운 외투를 꺼내세요. 👔";
            else advice = "패딩이나 두꺼운 코트가 필수입니다. 목도리를 챙겨 체온을 보호하세요! 🧣";

            if(weather === 'Rain' || weather === 'Drizzle') advice += " <br><span style='color:#a8d1ff;'>※ 비가 오니 우산을 확실히 구비하세요! ☔</span>";
            document.getElementById('coordi-advice').innerHTML = advice;
        }

        function calculateTimeline(fData) {
            const container = document.getElementById('timeline-container'); container.innerHTML = "";
            for (let i = 1; i <= 3; i++) {
                const targetForecast = fData.list[i]; if(!targetForecast) break;
                const fTemp = Math.round(targetForecast.main.temp);
                const fTime = targetForecast.dt_txt.substring(11, 16);
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `${fTime}<br><b style="font-size:1.1rem; color:#81c784;">${fTemp}°C</b><br><span style="font-size:0.72rem; color:#bbb;">${targetForecast.weather[0].description}</span>`;
                container.appendChild(item);
            }
        }

        function initParticleEffect(weather) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId); particles = [];
            if (weather !== 'Rain' && weather !== 'Drizzle' && weather !== 'Snow') { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
            const max = weather === 'Snow' ? 60 : 120;
            for (let i = 0; i < max; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    speed: weather === 'Snow' ? (Math.random() * 0.8 + 0.4) : (Math.random() * 4 + 7),
                    length: weather === 'Snow' ? Math.random() * 3 + 1.5 : Math.random() * 14 + 8, wobble: Math.random() * 2
                });
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = weather === 'Snow' ? 'rgba(255,255,255,0.6)' : 'rgba(174,194,224,0.4)'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
                particles.forEach(p => {
                    ctx.beginPath();
                    if (weather === 'Snow') {
                        p.x += Math.sin(p.wobble) * 0.2; p.wobble += 0.01; ctx.arc(p.x, p.y, p.length, 0, Math.PI * 2); ctx.fill();
                    } else {
                        ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.length); ctx.stroke();
                    }
                    p.y += p.speed; if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
                });
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        window.onload = function() {
            startClock();
            canvas = document.getElementById('particle-canvas'); ctx = canvas.getContext('2d');
            window.addEventListener('resize', resizeCanvas); resizeCanvas();

            initAudioEngine();

            const savedMemo = localStorage.getItem('weather_dashboard_memo');
            if(savedMemo) document.getElementById('memo-pad').value = savedMemo;

            const savedMain = localStorage.getItem('saved_main');
            const savedSub = localStorage.getItem('saved_sub');
            if (savedMain && savedSub) {
                document.getElementById('main-region').value = savedMain; updateSubRegions();
                document.getElementById('sub-region').value = savedSub; targetCityCode = savedSub;
                initWeatherSync();
            }
        }
    </script>
</body>
